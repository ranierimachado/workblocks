services:
  app: &app
    build:
      context: .
      target: app
    restart: unless-stopped
    environment: &app_environment
      APP_NAME: Workblocks
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:8088}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/workblocks.sqlite
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_DRIVER: file
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      WORKBLOCKS_PASSWORD: ${WORKBLOCKS_PASSWORD:?Set WORKBLOCKS_PASSWORD in .env}
      BACKUP_DIRECTORY: /data/backups
      WORKBLOCKS_FEED_ENABLED: "true"
      WORKBLOCKS_FEED_DIRECTORY: /data/documents
    volumes:
      - workblocks_data:/data
      - workblocks_locks:/var/www/html/storage/framework
    healthcheck:
      test: ["CMD", "php", "artisan", "feed:status"]
      interval: 10s
      timeout: 5s
      retries: 6
  feed:
    <<: *app
    command: ["su-exec", "www-data", "php", "artisan", "feed:watch", "--interval=15"]
    environment:
      <<: *app_environment
      WORKBLOCKS_SKIP_MIGRATION: "true"
    depends_on:
      app:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
volumes:
  workblocks_data:
  workblocks_locks:
